name: Generate Contribution Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution grid snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AhmadBilalDSA
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#0f172a,#1e293b,#0284c7,#38bdf8,#7dd3fc
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#0f172a,#1e293b,#0284c7,#38bdf8,#7dd3fc

      - name: Push snake svgs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}